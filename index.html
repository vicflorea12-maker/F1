<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0f"><title>F1 — Upcoming Races</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--panel:#15151d;--muted:#a4a4b2;--red:#e10600;--line:#292934;--white:#f7f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#341111 0,transparent 38%),var(--bg);color:var(--white);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:28px 16px}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:900;letter-spacing:.14em}.brand span{color:var(--red)}.season{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 10px}.eyebrow{color:var(--red);font-size:.75rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin:26px 0 8px}.hero{background:linear-gradient(135deg,#20202a,#121218);border:1px solid #38313a;border-radius:20px;padding:clamp(20px,5vw,34px);position:relative;overflow:hidden}.hero:after{content:'F1';position:absolute;right:-8px;top:-38px;font-size:clamp(110px,24vw,190px);font-weight:1000;font-style:italic;color:#ffffff08;pointer-events:none}.hero h1{font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.08;margin:0 0 10px;max-width:520px}.place{color:var(--muted);margin:0 0 22px}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:500px}.time{background:#0c0c12;border:1px solid #34343e;border-radius:12px;text-align:center;padding:12px 5px}.num{font-size:clamp(1.4rem,4vw,2rem);font-weight:850;font-variant-numeric:tabular-nums;line-height:1.2}.unit{font-size:.65rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.race-time{margin-top:18px;color:#ddd;font-size:.9rem}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}.section-head h2{font-size:1rem;margin:0}.section-head span{font-size:.75rem;color:var(--muted)}.race-list{display:grid;gap:10px}.race{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.round{font-size:.72rem;color:var(--muted);font-weight:800;letter-spacing:.08em}.flag{font-size:1.5rem}.race h3{font-size:.98rem;margin:0 0 3px}.race p{font-size:.8rem;color:var(--muted);margin:0}.date{font-size:.8rem;text-align:right;color:#eee;white-space:nowrap}.next{border-color:#7a211f;box-shadow:inset 3px 0 var(--red)}.next .round{color:#ff625c}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:.72rem;color:var(--muted)}a{color:#ff625c;text-decoration:none}a:hover{text-decoration:underline}@media(max-width:460px){.race{grid-template-columns:42px 1fr;gap:10px;padding:13px}.date{grid-column:2;text-align:left;margin-top:-5px}.flag{font-size:1.25rem}.round{font-size:.65rem}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><span>F1</span> / RACE RADAR</div><div class="season">2026 SEASON</div></header>
<div class="eyebrow">Next up · Round 20</div>
<section class="hero"><h1 id="nextName">São Paulo Grand Prix</h1><p class="place" id="nextPlace">Interlagos · São Paulo, Brazil</p>
<div class="countdown" aria-label="Countdown to next race"><div class="time"><div class="num" id="days">—</div><div class="unit">Days</div></div><div class="time"><div class="num" id="hours">—</div><div class="unit">Hours</div></div><div class="time"><div class="num" id="minutes">—</div><div class="unit">Minutes</div></div><div class="time"><div class="num" id="seconds">—</div><div class="unit">Seconds</div></div></div>
<div class="race-time" id="nextWhen">Race: Sunday, 8 November · 18:00 CET</div></section>
<div class="section-head"><h2>REMAINING RACES</h2><span id="raceCount">4 rounds to go</span></div><section class="race-list" id="raceList"></section>
<footer class="footer"><span>Times shown in Central European time</span><span>Schedule may change · <a href="https://www.formula1.com/en/racing/2026.html" target="_blank" rel="noreferrer">Official F1 calendar ↗</a></span></footer>
</main>
<script>
// Race start times use Central European local time (CET/CEST) for the 2026 calendar.
const races=[
 {round:20,name:'São Paulo Grand Prix',place:'Interlagos · Brazil',flag:'🇧🇷',date:'2026-11-08T18:00:00+01:00',weekend:'6–8 November',when:'Sunday, 8 November · 18:00 CET'},
 {round:21,name:'Las Vegas Grand Prix',place:'Las Vegas Strip Circuit · USA',flag:'🇺🇸',date:'2026-11-22T05:00:00+01:00',weekend:'19–21 November',when:'Sunday, 22 November · 05:00 CET'},
 {round:22,name:'Qatar Grand Prix',place:'Lusail International Circuit · Qatar',flag:'🇶🇦',date:'2026-11-29T17:00:00+01:00',weekend:'27–29 November',when:'Sunday, 29 November · 17:00 CET'},
 {round:23,name:'Abu Dhabi Grand Prix',place:'Yas Marina Circuit · UAE',flag:'🇦🇪',date:'2026-12-06T14:00:00+01:00',weekend:'4–6 December',when:'Sunday, 6 December · 14:00 CET'}
];
const $=id=>document.getElementById(id);function render(){const now=Date.now();let next=races.find(r=>new Date(r.date).getTime()>now);if(!next){$('nextName').textContent='Season complete';$('nextPlace').textContent='The 2026 season has finished.';$('nextWhen').textContent='See you next season.';$('days').textContent=$('hours').textContent=$('minutes').textContent=$('seconds').textContent='00';$('raceList').innerHTML='';$('raceCount').textContent='Season complete';return}
$('nextName').textContent=next.name;$('nextPlace').textContent=next.place;$('nextWhen').textContent='Race: '+next.when;let diff=Math.max(0,new Date(next.date).getTime()-now);$('days').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');$('hours').textContent=String(Math.floor(diff%86400000/3600000)).padStart(2,'0');$('minutes').textContent=String(Math.floor(diff%3600000/60000)).padStart(2,'0');$('seconds').textContent=String(Math.floor(diff%60000/1000)).padStart(2,'0');let remaining=races.filter(r=>new Date(r.date).getTime()>now);$('raceCount').textContent=remaining.length+' round'+(remaining.length===1?'':'s')+' to go';$('raceList').innerHTML=remaining.map((r,i)=>`<article class="race ${i===0?'next':''}"><div><div class="round">ROUND ${r.round}</div><div class="flag">${r.flag}</div></div><div><h3>${r.name}</h3><p>${r.place}</p></div><div class="date">${r.weekend}</div></article>`).join('')}
render();setInterval(render,1000);
</script></body></html>
